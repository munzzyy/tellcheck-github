<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px; margin: 0; padding: 14px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #1f2328; background: #fff;
    }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .quota {
      border: 1px solid #d0d7de; border-radius: 8px; background: #f6f8fa;
      padding: 8px 10px; margin-bottom: 10px;
    }
    .bar { height: 6px; border-radius: 3px; background: rgba(110, 119, 129, 0.25); margin-top: 6px; overflow: hidden; }
    .bar > div { height: 100%; background: #1f6feb; }
    button {
      display: block; width: 100%; margin-top: 8px; padding: 7px 10px;
      border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa;
      font: 600 12px/1.3 inherit; cursor: pointer; text-align: center;
    }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    button[disabled] { cursor: default; opacity: 0.65; }
    button.primary[disabled] { background: #6e7781; border-color: #6e7781; }
    button[hidden] { display: none; }
    .muted { opacity: 0.7; font-size: 12px; }

    /* Dark last. It used to sit above the base rules, which have the same
       specificity, so the light button background won in dark mode and the
       secondary buttons rendered near-white text on near-white at 1.11:1.
       .quota only escaped that because it carried !important. */
    @media (prefers-color-scheme: dark) {
      body { color: #e6edf3; background: #0d1117; }
      .quota { background: #161b22; border-color: #30363d; }
      button { background: #21262d; color: #e6edf3; border-color: #30363d; }
      button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      button[disabled] { color: #6e7681; border-color: #30363d; }
    }
  </style>
</head>
<body>
  <h1>Tellcheck</h1>
  <div class="quota">
    <div id="quota-line" class="muted">No scans yet today.</div>
    <div class="bar" aria-hidden="true"><div id="quota-bar" style="width:0%"></div></div>
  </div>
  <button id="scan" class="primary">Scan this page</button>
  <button id="csv" hidden>Export last batch as CSV</button>
  <button id="options">Options</button>
  <p class="muted">Scores are a statistical signal, not proof. Nothing is scanned until you ask.</p>
  <script src="popup.js"></script>
</body>
</html>
