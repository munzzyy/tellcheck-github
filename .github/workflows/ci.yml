name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint the extension the way AMO does
        run: npx --yes web-ext@10 lint --source-dir extension

      - name: Syntax-check the worker and extension sources
        run: |
          for f in worker/src/index.js worker/src/comment-tells.js extension/*.js extension/*/*.js; do
            [ -f "$f" ] && node --check "$f"
          done

      # The comment-style layer ships with its synthetic Python-parity
      # fixtures: constructed texts pinning the tricky cases (unicode word
      # boundaries, round-half-even labels, band edges). The larger
      # corpus-derived set stays out of the repo and runs locally instead.
      - name: Comment-style layer parity
        run: node --test test/comment-tells.test.mjs

      # Real background.js against a stub worker that enforces the caps and the meter.
      - name: Background script
        run: node --test test/background.test.mjs

      # The detector is private, so the meter and request-cap tests run against a stub.
      - name: Worker meter and request caps
        run: node --import ./test/stub-detector.mjs --test test/worker-meter.test.mjs

      - name: CHANGELOG has a heading for the manifest version
        run: |
          python3 - <<'PY'
          import json, re, sys
          v = json.load(open("extension/manifest.json"))["version"]
          if not re.search(rf"^## {re.escape(v)} ", open("CHANGELOG.md").read(), re.M):
              sys.exit(f"CHANGELOG.md has no '## {v} ' heading")
          PY

      - name: Content script smoke test
        env:
          CHROMIUM: google-chrome
        run: python3 test/content_smoke.py

      - name: Popup smoke test
        env:
          CHROMIUM: google-chrome
        run: python3 test/popup_smoke.py
